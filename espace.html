<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeux BAFA</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<div id="passwordModal" class="modal">
  <div class="modal-content">
    <span id="closePasswordModal" class="close">&times;</span>
    <h2>Accès protégé</h2>
    <p>Veuillez saisir le mot de passe pour accéder à cette page :</p>
    <input type="password" id="passwordInput" placeholder="Mot de passe">
    <p id="passwordError" class="error hidden">Mot de passe incorrect</p>
    <button id="confirmPassword">Confirmer</button>
  </div>
</div>

<div class="page-content" id="pageContent">
  <h2>Répartition en groupes</h2>

  <div class="stats">
    <h3>📊 Statistiques</h3>
  </div>

  <form id="groupOptionsForm" class="options-panel">
    <h3>Options de répartition</h3>
    <div class="form-group">
      <label for="groupCount">Nombre de groupes :</label>
      <select id="groupCount" name="groupCount">
        <option value="2">2 groupes</option>
        <option value="3" selected>3 groupes</option>
        <option value="4">4 groupes</option>
        <option value="5">5 groupes</option>
      </select>
    </div>

    <div class="form-group">
      <label for="balanceMode">Mode d'équilibrage :</label>
      <select id="balanceMode" name="balanceMode">
        <option value="gender">Équilibrer par genre</option>
        <option value="age">Équilibrer par âge</option>
        <option value="both" selected>Équilibrer par genre et âge</option>
        <option value="random">Totalement aléatoire</option>
      </select>
    </div>

    <div class="form-group">
      <label>Groupes d'âge :</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="ageGroups" value="11" checked> 11 ans</label>
        <label><input type="checkbox" name="ageGroups" value="12" checked> 12 ans</label>
        <label><input type="checkbox" name="ageGroups" value="13" checked> 13 ans</label>
      </div>
    </div>

    <div class="form-group">
      <label>Inclure :</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="genderSelection" value="masculin" checked> Garçons</label>
        <label><input type="checkbox" name="genderSelection" value="feminin" checked> Filles</label>
      </div>
    </div>
  </form>

  <div class="button-container">
    <button class="regenerate-btn" onclick="regenerateGroups()">🔄 Générer les groupes</button>
  </div>

  <div class="groups-container" id="groupsContainer">
    <!-- Les groupes seront générés ici -->
  </div>

  <a href="index.html" class="back-button">Retour</a>

  <a href="#" class="back-to-top">⭡</a>

</div>

<footer id="footer">
  <br>
  <p style="color: white; text-align: center">
    &copy; By <a href="espace.html" style="color: white; text-decoration: none;">Romain SIEURIN</a>
  </p>
</footer>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

<script src="assets/js/main.js"></script>
</body>
</html>
